services:
  mariadb:
    image: mariadb:10
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: potof
      MARIADB_USER: potof
      MARIADB_PASSWORD: potof
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
